name: One-off dot position fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-dot-position.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry one-off dot positioning fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move augmentation dots closer to noteheads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('continued-fraction-expansion.html')
          text = p.read_text(encoding='utf-8')

          text, css_count = re.subn(
              r'\.dot\{position:absolute;left:24px;top:6px;font-size:34px;line-height:1\}',
              '.dot{position:absolute;left:18px;top:1px;font-size:34px;line-height:1}',
              text,
              count=1,
          )
          if css_count != 1:
              raise SystemExit(f'dot CSS replacement count: {css_count}')

          pattern = re.compile(
              r"dot\.style\.top='5px';\s*dot\.style\.left=`\$\{power<=0\?28:25\}px`;"
          )
          replacement = "dot.style.top='1px';\n    const baseLeft=power<=0?20:18;\n    dot.style.left=`${baseLeft + i*6}px`;"
          text, js_count = pattern.subn(replacement, text, count=1)
          if js_count != 1:
              raise SystemExit(f'dot JS replacement count: {js_count}')

          p.write_text(text, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('continued-fraction-expansion.html').read_text(encoding='utf-8')
          m = re.search(r'<script>\n([\s\S]*)</script>\n</body>', text)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/check.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/check.js

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/oneoff-fix-dot-position.yml
          git config user.name 'ttekesuke'
          git config user.email 'actions@users.noreply.github.com'
          git add continued-fraction-expansion.html .github/workflows/oneoff-fix-dot-position.yml
          git commit -m 'Move augmentation dots closer to noteheads'
          git push origin HEAD:main
