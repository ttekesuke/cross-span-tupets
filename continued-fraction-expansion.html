<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continued fraction expansion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; overflow: auto; }
    body { font-family: "Times New Roman", serif; color: #111; }
    #score { position: relative; display: block; min-height: 100vh; background: #fff; }
    .controls { position: fixed; top: 16px; left: 16px; z-index: 30; width: min(560px, calc(100vw - 32px)); }
    .control-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, input { height: 40px; border: 2px solid #111; background: #fff; color: #111; font: inherit; }
    button { padding: 0 14px; cursor: pointer; font-size: 20px; }
    input { width: 84px; padding: 0 8px; font-size: 20px; }
    .radical-label { font-size: 24px; display: inline-flex; align-items: center; gap: 2px; }
    .error-message { min-height: 20px; margin-top: 6px; font-family: sans-serif; font-size: 13px; color: #8b0000; }
    .stats-readout { margin-top: 10px; padding: 10px 12px; border: 2px solid #111; background: rgba(255,255,255,.94); font: 13px/1.45 "Courier New", monospace; }
    .stats-row + .stats-row { margin-top: 5px; }
    .stats-label { font-family: "Times New Roman", serif; margin-right: 6px; }
    .module-box { position: absolute; display: grid; grid-template-rows: 54px 62px 38px; width: max-content; transition: left 280ms ease, top 280ms ease; }
    .module-row-top, .module-row-result, .module-row-square { display: flex; align-items: flex-start; white-space: nowrap; }
    .module-row-top { align-items: baseline; gap: 6px; }
    .module-row-result { padding-left: 20px; align-items: flex-start; }
    .module-row-square { padding-left: 22px; }
    .bracket { width: 14px; height: 26px; border-left: 2.2px solid #111; border-top: 2.2px solid #111; position: relative; top: 3px; flex: 0 0 auto; }
    .split-label { font-size: 44px; line-height: 1; position: relative; }
    .split-label sup, .square-label sup { position: relative; font-size: .45em; vertical-align: baseline; line-height: 1; }
    .split-label sup { top: -.7em; margin-left: -.12em; }
    .square-label { font-size: 28px; line-height: 1; }
    .square-label sup { top: -.62em; margin-left: -.14em; }
    .breve { display: inline-flex; align-items: baseline; gap: 6px; height: 46px; white-space: nowrap; }
    .breve-count { font-size: 44px; line-height: 1; }
    .breve-note { position: relative; top: 4px; width: 58px; height: 30px; flex: 0 0 auto; }
    .breve-head { position: absolute; left: 12px; top: 1px; width: 34px; height: 26px; border: 2.2px solid #111; border-radius: 50%; background: #fff; }
    .breve-bar { position: absolute; top: 1px; width: 2.2px; height: 26px; background: #111; }
    .breve-bar.left-outer { left: 0; } .breve-bar.left-inner { left: 5px; }
    .breve-bar.right-inner { right: 5px; } .breve-bar.right-outer { right: 0; }
    .result-note-wrap { position: relative; display: inline-flex; flex-direction: column; align-items: center; min-width: 64px; padding-top: 2px; }
    .result-note-label { font: 14px/1 "Courier New", monospace; min-height: 15px; margin-bottom: 1px; }
    .note-glyph { position: relative; width: 52px; height: 40px; }
    .note-head { position: absolute; width: 24px; height: 16px; border-radius: 50%; transform: rotate(-14deg); left: 7px; top: 17px; border: 2px solid #111; background: #fff; }
    .note-head.filled { background: #111; }
    .note-stem { position: absolute; left: 29px; top: 2px; width: 2px; height: 29px; background: #111; }
    .note-flag { position: absolute; left: 30px; width: 16px; height: 7px; border-top: 2px solid #111; border-radius: 0 10px 0 0; transform: skewY(17deg); transform-origin: left top; }
    .whole .note-stem, .whole .note-flag { display: none; }
    .half .note-head { background: #fff; }
    .quarter .note-head, .flagged .note-head { background: #111; }
    .root-row { position: absolute; display: flex; align-items: flex-start; gap: 6px; transition: left 280ms ease, top 280ms ease; }
    .root-count { font-size: 34px; line-height: 1.1; padding-top: 8px; }
    .whole-note-token { position: relative; width: 44px; height: 36px; }
    .whole-note-token::before { content: ""; position: absolute; left: 8px; top: 10px; width: 28px; height: 18px; border: 2.2px solid #111; border-radius: 50%; transform: rotate(-12deg); background: #fff; }
    .tie-layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 5; }
    .tie-path { fill: none; stroke: #111; stroke-width: 2; vector-effect: non-scaling-stroke; }
  </style>
</head>
<body>
  <div class="controls">
    <div class="control-row">
      <label class="radical-label">√<input id="radicand-input" type="number" min="2" step="1" value="2" aria-label="Radicand"></label>
      <button id="apply-radicand" type="button">apply</button>
      <button id="add-depth-button" type="button">adding nest</button>
    </div>
    <div class="error-message" id="error-message"></div>
    <div class="stats-readout">
      <div class="stats-row"><span class="stats-label">approx:</span><span id="approx-value"></span></div>
      <div class="stats-row"><span class="stats-label" id="truth-label">sqrt(2):</span><span id="truth-value"></span></div>
      <div class="stats-row"><span class="stats-label">error:</span><span id="error-value"></span></div>
      <div class="stats-row" id="stats-formula"></div>
    </div>
  </div>

  <div id="score" role="img" aria-label="Nested continued fraction score"></div>

  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
  <script>
    const config = {
      radicand: 2,
      topPaddingPx: 48,
      bottomPaddingPx: 40,
      leftPaddingPx: 28,
      rightPaddingPx: 76,
      stepYPx: 58,
      stageHeightPaddingPx: 24,
      currentBoxLeftPx: 110,
      rootNoteLeftPx: 28,
      resultRowOffsetPx: 54,
      moduleOverlapPx: 56,
      minStepXPx: 174,
    };

    const score = document.getElementById('score');
    const addDepthButton = document.getElementById('add-depth-button');
    const radicandInput = document.getElementById('radicand-input');
    const applyRadicandButton = document.getElementById('apply-radicand');
    const errorMessage = document.getElementById('error-message');
    const approxValue = document.getElementById('approx-value');
    const truthValue = document.getElementById('truth-value');
    const truthLabel = document.getElementById('truth-label');
    const errorValue = document.getElementById('error-value');
    const statsFormula = document.getElementById('stats-formula');

    Decimal.set({ precision: 50, rounding: Decimal.ROUND_HALF_UP });

    const state = {
      depth: 1,
      a0: 1,
      modules: [],
      partialTerms: [],
      continuedFraction: null,
      trueRadicalDecimal: new Decimal(2).sqrt(),
      moduleElements: new Map(),
      rootRow: null,
      tieLayer: null,
    };

    function createElement(tag, className, styles = {}) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      Object.assign(el.style, styles);
      return el;
    }

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) [a, b] = [b, a % b];
      return a || 1;
    }

    function simplifyFraction(numerator, denominator) {
      if (denominator < 0) return simplifyFraction(-numerator, -denominator);
      const g = gcd(numerator, denominator);
      return { numerator: numerator / g, denominator: denominator / g };
    }

    function addFractions(a, b) {
      return simplifyFraction(a.numerator * b.denominator + b.numerator * a.denominator, a.denominator * b.denominator);
    }

    function reciprocalFraction(f) { return simplifyFraction(f.denominator, f.numerator); }

    function createSquareRootContinuedFraction(radicand) {
      const a0 = Math.floor(Math.sqrt(radicand));
      if (a0 * a0 === radicand) throw new Error('perfect square');
      let m = 0, d = 1, a = a0;
      return {
        a0,
        nextTerm() {
          m = d * a - m;
          d = (radicand - m * m) / d;
          a = Math.floor((a0 + m) / d);
          return a;
        },
      };
    }

    function ensureTerms(count) {
      while (state.partialTerms.length < count) state.partialTerms.push(state.continuedFraction.nextTerm());
    }

    function buildNestedModules(depth) {
      ensureTerms(depth);
      const selected = state.partialTerms.slice(0, depth);
      const modules = [];
      let childValue = null;
      for (let i = selected.length - 1; i >= 0; i -= 1) {
        const integerTerm = selected[i];
        const denominatorExpression = childValue
          ? addFractions({ numerator: integerTerm, denominator: 1 }, childValue)
          : { numerator: integerTerm, denominator: 1 };
        const value = reciprocalFraction(denominatorExpression);
        modules.push({ integerTerm, denominatorExpression, value });
        childValue = value;
      }
      return modules;
    }

    function formatFraction(f) { return `${f.numerator}/${f.denominator}`; }
    function fractionToDecimal(f) { return new Decimal(f.numerator).div(f.denominator); }
    function formatDecimal(d, places = 36) { return d.toDecimalPlaces(places).toFixed(places); }

    function createBreveToken(integerTerm) {
      const noteMultiplier = integerTerm / 2;
      const countLabel = Number.isInteger(noteMultiplier) ? String(noteMultiplier) : `${integerTerm}/2`;
      const wrapper = createElement('div', 'breve');
      const count = createElement('div', 'breve-count');
      count.textContent = countLabel;
      wrapper.appendChild(count);
      const note = createElement('div', 'breve-note input-note-anchor');
      ['left-outer','left-inner','right-inner','right-outer'].forEach(name => note.appendChild(createElement('div', `breve-bar ${name}`)));
      note.appendChild(createElement('div', 'breve-head'));
      wrapper.appendChild(note);
      return wrapper;
    }

    function chooseWrittenNote(value) {
      const d = value.numerator / value.denominator;
      const candidates = [
        { name: 'breve', duration: 2, flags: -2 },
        { name: 'whole', duration: 1, flags: -1 },
        { name: 'half', duration: 1/2, flags: 0 },
        { name: 'quarter', duration: 1/4, flags: 0 },
        { name: 'eighth', duration: 1/8, flags: 1 },
        { name: '16th', duration: 1/16, flags: 2 },
        { name: '32nd', duration: 1/32, flags: 3 },
        { name: '64th', duration: 1/64, flags: 4 },
        { name: '128th', duration: 1/128, flags: 5 },
      ];
      let best = candidates[0];
      let bestScore = Infinity;
      for (const c of candidates) {
        const distance = Math.abs(Math.log2(d / c.duration));
        const flagPenalty = Math.max(0, c.flags) * 0.035;
        const score = distance + flagPenalty;
        if (score < bestScore - 1e-12) { best = c; bestScore = score; }
      }
      const base = simplifyFraction(Math.round(best.duration * 128), 128);
      const ratio = simplifyFraction(value.numerator * base.denominator, value.denominator * base.numerator);
      const isExact = ratio.numerator === ratio.denominator;
      const tupletLabel = isExact ? '' : `${ratio.denominator}:${ratio.numerator}`;
      return { ...best, tupletLabel };
    }

    function createResultNote(value) {
      const spec = chooseWrittenNote(value);
      const wrap = createElement('div', 'result-note-wrap result-note-anchor');
      const label = createElement('div', 'result-note-label');
      label.textContent = spec.tupletLabel;
      wrap.appendChild(label);

      if (spec.name === 'breve') {
        const breve = createElement('div', 'breve-note');
        ['left-outer','left-inner','right-inner','right-outer'].forEach(name => breve.appendChild(createElement('div', `breve-bar ${name}`)));
        breve.appendChild(createElement('div', 'breve-head'));
        wrap.appendChild(breve);
        return wrap;
      }

      const glyphClass = spec.name === 'whole' ? 'whole' : spec.name === 'half' ? 'half' : spec.flags > 0 ? 'flagged' : 'quarter';
      const glyph = createElement('div', `note-glyph ${glyphClass}`);
      const head = createElement('div', `note-head ${glyphClass === 'quarter' || glyphClass === 'flagged' ? 'filled' : ''}`);
      glyph.appendChild(head);
      if (spec.name !== 'whole') glyph.appendChild(createElement('div', 'note-stem'));
      for (let i = 0; i < Math.max(0, spec.flags); i += 1) {
        const flag = createElement('div', 'note-flag', { top: `${4 + i * 6}px` });
        glyph.appendChild(flag);
      }
      wrap.appendChild(glyph);
      return wrap;
    }

    function createModuleBox(module) {
      const group = createElement('div', 'module-box');
      const top = createElement('div', 'module-row-top');
      top.appendChild(createElement('div', 'bracket'));
      const split = createElement('div', 'split-label');
      split.innerHTML = `${module.value.denominator}<sup>2</sup><span>:</span>`;
      top.appendChild(split);
      top.appendChild(createBreveToken(module.integerTerm));
      group.appendChild(top);

      const result = createElement('div', 'module-row-result');
      result.appendChild(createResultNote(module.value));
      group.appendChild(result);

      const sq = createElement('div', 'module-row-square square-label');
      sq.innerHTML = `(${module.value.numerator}/${module.value.denominator})<sup>2</sup>`;
      group.appendChild(sq);
      return group;
    }

    function getModuleWidth(module) {
      const count = module.integerTerm / 2;
      const countText = Number.isInteger(count) ? String(count) : `${module.integerTerm}/2`;
      return 14 + 6 + String(module.value.denominator).length * 32 + 40 + countText.length * 26 + 70;
    }

    function getLayout() {
      const totalHeight = 154;
      const stageHeight = Math.max(window.innerHeight, totalHeight + config.topPaddingPx + config.bottomPaddingPx + (state.depth - 1) * config.stepYPx + config.stageHeightPaddingPx);
      const currentTop = stageHeight - config.bottomPaddingPx - totalHeight;
      const positions = new Map();
      let previousLeft = config.currentBoxLeftPx;
      let previousWidth = getModuleWidth(state.modules[state.depth - 1]);
      for (let age = 0; age < state.depth; age += 1) {
        const index = state.depth - 1 - age;
        if (age === 0) positions.set(index, { left: config.currentBoxLeftPx, top: currentTop });
        else {
          const stepX = Math.max(previousWidth - config.moduleOverlapPx, config.minStepXPx);
          const left = previousLeft + stepX;
          const top = currentTop - age * config.stepYPx;
          positions.set(index, { left, top });
          previousLeft = left;
          previousWidth = getModuleWidth(state.modules[index]);
        }
      }
      const maxRight = Math.max(...state.modules.map((m, i) => positions.get(i).left + getModuleWidth(m)), window.innerWidth - config.rightPaddingPx);
      return { stageHeight, currentTop, positions, stageWidth: maxRight + config.rightPaddingPx };
    }

    function ensureTieLayer() {
      if (state.tieLayer) return;
      state.tieLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      state.tieLayer.setAttribute('class', 'tie-layer');
      score.appendChild(state.tieLayer);
    }

    function pointFor(element, side) {
      const r = element.getBoundingClientRect();
      const s = score.getBoundingClientRect();
      return {
        x: (side === 'left' ? r.left : side === 'right' ? r.right : r.left + r.width / 2) - s.left,
        y: r.bottom - s.top - 4,
      };
    }

    function addTie(start, end) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'tie-path');
      const dx = end.x - start.x;
      const sag = Math.min(20, Math.max(8, Math.abs(dx) * 0.06));
      const c1x = start.x + dx * .33;
      const c2x = start.x + dx * .67;
      path.setAttribute('d', `M ${start.x} ${start.y} C ${c1x} ${start.y + sag}, ${c2x} ${end.y + sag}, ${end.x} ${end.y}`);
      state.tieLayer.appendChild(path);
    }

    function syncRootRow(currentTop) {
      if (!state.rootRow) {
        const row = createElement('div', 'root-row');
        const count = createElement('div', 'root-count');
        const note = createElement('div', 'whole-note-token root-note-anchor');
        row.appendChild(count); row.appendChild(note);
        state.rootRow = { element: row, count, note };
        score.appendChild(row);
      }
      state.rootRow.count.textContent = state.a0 === 1 ? '' : `${state.a0}×`;
      state.rootRow.element.style.left = `${config.rootNoteLeftPx}px`;
      state.rootRow.element.style.top = `${currentTop + config.resultRowOffsetPx + 7}px`;
    }

    function syncTies(layout) {
      ensureTieLayer();
      state.tieLayer.setAttribute('width', layout.stageWidth);
      state.tieLayer.setAttribute('height', layout.stageHeight);
      state.tieLayer.setAttribute('viewBox', `0 0 ${layout.stageWidth} ${layout.stageHeight}`);
      state.tieLayer.replaceChildren();

      for (let index = 0; index < state.depth - 1; index += 1) {
        const shallow = state.moduleElements.get(index);
        const deeper = state.moduleElements.get(index + 1);
        if (!shallow || !deeper) continue;
        const from = shallow.querySelector('.result-note-anchor');
        const to = deeper.querySelector('.input-note-anchor');
        if (!from || !to) continue;
        addTie(pointFor(from, 'left'), pointFor(to, 'right'));
      }

      const outermost = state.moduleElements.get(state.depth - 1);
      if (outermost && state.rootRow) {
        const from = outermost.querySelector('.result-note-anchor');
        if (from) addTie(pointFor(from, 'left'), pointFor(state.rootRow.note, 'right'));
      }
    }

    function renderStats() {
      if (!state.modules.length) return;
      const tail = state.modules[state.modules.length - 1].value;
      const approximation = addFractions({ numerator: state.a0, denominator: 1 }, tail);
      const dec = fractionToDecimal(approximation);
      approxValue.textContent = formatDecimal(dec);
      truthLabel.textContent = `sqrt(${config.radicand}):`;
      truthValue.textContent = formatDecimal(state.trueRadicalDecimal);
      errorValue.textContent = formatDecimal(dec.sub(state.trueRadicalDecimal).abs());
      statsFormula.textContent = `${state.a0} + ${formatFraction(tail)} = ${formatFraction(approximation)}`;
    }

    function renderScore() {
      state.modules = buildNestedModules(state.depth);
      const layout = getLayout();
      score.style.width = `${layout.stageWidth}px`;
      score.style.height = `${layout.stageHeight}px`;
      syncRootRow(layout.currentTop);

      for (const [index, el] of state.moduleElements.entries()) {
        if (index >= state.depth) { el.remove(); state.moduleElements.delete(index); }
      }
      for (let index = 0; index < state.depth; index += 1) {
        let el = state.moduleElements.get(index);
        if (!el) {
          el = createModuleBox(state.modules[index]);
          score.appendChild(el);
          state.moduleElements.set(index, el);
        } else {
          const replacement = createModuleBox(state.modules[index]);
          el.replaceWith(replacement);
          state.moduleElements.set(index, replacement);
          el = replacement;
        }
        const pos = layout.positions.get(index);
        el.style.left = `${pos.left}px`;
        el.style.top = `${pos.top}px`;
      }
      requestAnimationFrame(() => requestAnimationFrame(() => syncTies(layout)));
      renderStats();
    }

    function resetForRadicand(radicand) {
      const n = Number(radicand);
      if (!Number.isInteger(n) || n < 2) throw new Error('2以上の整数を入力してください。');
      const root = Math.floor(Math.sqrt(n));
      if (root * root === n) throw new Error('完全平方数では連分数ネストが不要です。別の整数を入力してください。');
      config.radicand = n;
      state.depth = 1;
      state.partialTerms = [];
      state.continuedFraction = createSquareRootContinuedFraction(n);
      state.a0 = state.continuedFraction.a0;
      state.trueRadicalDecimal = new Decimal(n).sqrt();
      for (const el of state.moduleElements.values()) el.remove();
      state.moduleElements.clear();
      if (state.rootRow) { state.rootRow.element.remove(); state.rootRow = null; }
      if (state.tieLayer) { state.tieLayer.remove(); state.tieLayer = null; }
      errorMessage.textContent = '';
      renderScore();
    }

    addDepthButton.addEventListener('click', () => { state.depth += 1; renderScore(); });
    applyRadicandButton.addEventListener('click', () => {
      try { resetForRadicand(radicandInput.value); }
      catch (error) { errorMessage.textContent = error.message; }
    });
    radicandInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') applyRadicandButton.click(); });
    window.addEventListener('resize', renderScore, { passive: true });

    resetForRadicand(2);
  </script>
</body>
</html>
