<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continued fraction expansion</title>
  <style>
    @font-face {
      font-family: "BravuraText";
      src: url("https://cdn.jsdelivr.net/gh/steinbergmedia/bravura@master/redist/woff/BravuraText.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; overflow: auto; }
    body { font-family: "Times New Roman", serif; }

    .controls {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 30;
      width: min(620px, calc(100vw - 28px));
      padding: 10px 12px;
      border: 1.5px solid #111;
      background: rgba(255, 255, 255, 0.95);
    }
    .control-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .radical-label { display: inline-flex; align-items: center; gap: 4px; font-size: 24px; }
    button, input {
      height: 36px;
      border: 1.5px solid #111;
      background: #fff;
      color: #111;
      font: inherit;
    }
    input { width: 110px; padding: 0 8px; font-size: 18px; }
    button { padding: 0 12px; cursor: pointer; font-size: 17px; }
    .error-message { min-height: 18px; margin-top: 5px; font: 12px/1.3 sans-serif; color: #8b0000; }
    .stats-readout { margin-top: 6px; font: 12px/1.45 "Courier New", monospace; }
    .stats-row + .stats-row { margin-top: 2px; }
    .stats-label { display: inline-block; min-width: 58px; font-family: "Times New Roman", serif; }

    #score {
      position: relative;
      min-width: 100vw;
      min-height: 100vh;
      background: #fff;
    }

    .module {
      position: absolute;
      width: max-content;
      min-width: 205px;
      height: 118px;
      white-space: nowrap;
    }
    .tuplet-bracket {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 205px;
      height: 48px;
      padding: 0 15px;
    }
    .tuplet-bracket::before {
      content: "";
      position: absolute;
      top: 22px;
      left: 0;
      right: 0;
      border-top: 1.7px solid #111;
    }
    .bracket-hook-left,
    .bracket-hook-right {
      position: absolute;
      top: 22px;
      width: 1.7px;
      height: 13px;
      background: #111;
    }
    .bracket-hook-left { left: 0; }
    .bracket-hook-right { right: 0; }
    .tuplet-label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      min-height: 42px;
      padding: 0 7px;
      background: #fff;
    }
    .smufl { font-family: "BravuraText", sans-serif; font-style: normal; font-weight: normal; }
    .tuplet-digits { font-size: 29px; line-height: 1; letter-spacing: -0.04em; }
    .tuplet-colon { font-size: 29px; line-height: 1; }
    .unit-note { font-size: 40px; line-height: 1; margin-left: 1px; }
    .input-span {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      min-height: 40px;
    }
    .duration-sequence {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      position: relative;
    }
    .note-token {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      min-width: 25px;
      min-height: 42px;
      font-size: 45px;
      line-height: 1;
    }
    .note-token.compact-count { gap: 2px; }
    .count-prefix {
      display: inline-block;
      align-self: center;
      margin-right: 1px;
      font-family: "BravuraText", sans-serif;
      font-size: 24px;
      line-height: 1;
    }
    .times-sign {
      display: inline-block;
      align-self: center;
      margin-right: 1px;
      font: 20px/1 "Times New Roman", serif;
    }
    .note-char { display: inline-block; }
    .dot-char { display: inline-block; margin-left: -0.12em; }

    .result-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      min-height: 62px;
      padding-left: 18px;
    }
    .result-sequence {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      min-height: 50px;
    }
    .result-caption {
      position: absolute;
      top: 47px;
      left: 20px;
      font: 11px/1.2 "Courier New", monospace;
      color: #555;
    }

    .root-row {
      position: absolute;
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      min-height: 52px;
    }

    .tie-layer {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 10;
    }
    .tie-path {
      fill: none;
      stroke: #111;
      stroke-width: 1.8;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .legend {
      position: fixed;
      right: 14px;
      top: 14px;
      z-index: 25;
      max-width: min(380px, calc(100vw - 28px));
      padding: 8px 10px;
      border: 1px solid #aaa;
      background: rgba(255,255,255,.93);
      font: 12px/1.35 sans-serif;
    }
    .legend .smufl { font-size: 24px; vertical-align: middle; }

    @media (max-width: 900px) {
      .legend { display: none; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="control-row">
      <label class="radical-label">√<input id="radicand-input" type="text" inputmode="numeric" value="2" aria-label="Radicand"></label>
      <button id="apply-radicand" type="button">apply</button>
      <button id="add-depth-button" type="button">adding nest</button>
      <button id="remove-depth-button" type="button">remove nest</button>
    </div>
    <div class="error-message" id="error-message"></div>
    <div class="stats-readout">
      <div class="stats-row"><span class="stats-label">CF:</span><span id="cf-value"></span></div>
      <div class="stats-row"><span class="stats-label">approx:</span><span id="approx-value"></span></div>
      <div class="stats-row"><span class="stats-label" id="truth-label">sqrt(2):</span><span id="truth-value"></span></div>
      <div class="stats-row"><span class="stats-label">error:</span><span id="error-value"></span></div>
    </div>
  </div>

  <div class="legend">
    The score uses Bravura Text (SMuFL). Tuplet numbers/colon and all note glyphs are font glyphs; brackets and ties are geometric notation primitives.
  </div>

  <div id="score" role="img" aria-label="Nested continued-fraction tuplet notation"></div>

  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
  <script>
    const config = {
      scoreTopPx: 178,
      leftPaddingPx: 34,
      rightPaddingPx: 80,
      bottomPaddingPx: 70,
      rootReservePx: 170,
      stepYPx: 62,
      minStepXPx: 245,
      gapXPx: 58,
      maxMetronomePower: 10,
      maxDots: 3,
      compactBreveThreshold: 5n,
    };

    const SMUFL = {
      tuplet0: 0xE880,
      tupletColon: 0xE88A,
      metNoteDoubleWhole: 0xECA0,
      metNoteWhole: 0xECA2,
      metNoteHalfUp: 0xECA3,
      metNoteQuarterUp: 0xECA5,
      metNote8thUp: 0xECA7,
      metNote16thUp: 0xECA9,
      metNote32ndUp: 0xECAB,
      metNote64thUp: 0xECAD,
      metNote128thUp: 0xECAF,
      metNote256thUp: 0xECB1,
      metNote512thUp: 0xECB3,
      metNote1024thUp: 0xECB5,
      metAugmentationDot: 0xECB7,
    };

    const NOTE_CODEPOINT_BY_POWER = new Map([
      [-1, SMUFL.metNoteDoubleWhole],
      [0, SMUFL.metNoteWhole],
      [1, SMUFL.metNoteHalfUp],
      [2, SMUFL.metNoteQuarterUp],
      [3, SMUFL.metNote8thUp],
      [4, SMUFL.metNote16thUp],
      [5, SMUFL.metNote32ndUp],
      [6, SMUFL.metNote64thUp],
      [7, SMUFL.metNote128thUp],
      [8, SMUFL.metNote256thUp],
      [9, SMUFL.metNote512thUp],
      [10, SMUFL.metNote1024thUp],
    ]);

    const score = document.getElementById('score');
    const radicandInput = document.getElementById('radicand-input');
    const applyRadicandButton = document.getElementById('apply-radicand');
    const addDepthButton = document.getElementById('add-depth-button');
    const removeDepthButton = document.getElementById('remove-depth-button');
    const errorMessage = document.getElementById('error-message');
    const cfValue = document.getElementById('cf-value');
    const approxValue = document.getElementById('approx-value');
    const truthValue = document.getElementById('truth-value');
    const truthLabel = document.getElementById('truth-label');
    const errorValue = document.getElementById('error-value');

    Decimal.set({ precision: 70, rounding: Decimal.ROUND_HALF_UP });

    const state = {
      radicand: 2n,
      depth: 1,
      a0: 1n,
      partialTerms: [],
      continuedFraction: null,
      modules: [],
      trueRadicalDecimal: new Decimal(2).sqrt(),
      tieLayer: null,
      moduleElements: [],
      rootRow: null,
    };

    function createElement(tag, className, text = '') {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== '') el.textContent = text;
      return el;
    }

    function char(codepoint) {
      return String.fromCodePoint(codepoint);
    }

    function absBigInt(value) {
      return value < 0n ? -value : value;
    }

    function gcd(a, b) {
      a = absBigInt(a);
      b = absBigInt(b);
      while (b !== 0n) {
        const t = a % b;
        a = b;
        b = t;
      }
      return a || 1n;
    }

    function fraction(numerator, denominator = 1n) {
      if (denominator === 0n) throw new Error('zero denominator');
      if (denominator < 0n) return fraction(-numerator, -denominator);
      const g = gcd(numerator, denominator);
      return { numerator: numerator / g, denominator: denominator / g };
    }

    function addFractions(a, b) {
      return fraction(
        a.numerator * b.denominator + b.numerator * a.denominator,
        a.denominator * b.denominator,
      );
    }

    function reciprocalFraction(value) {
      return fraction(value.denominator, value.numerator);
    }

    function formatFraction(value) {
      return `${value.numerator.toString()}/${value.denominator.toString()}`;
    }

    function fractionToDecimal(value) {
      return new Decimal(value.numerator.toString()).div(value.denominator.toString());
    }

    function formatDecimal(value, places = 40) {
      return value.toDecimalPlaces(places).toFixed(places);
    }

    function bigintSqrt(value) {
      if (value < 0n) throw new Error('negative radicand');
      if (value < 2n) return value;
      let x0 = 1n << BigInt(Math.ceil(value.toString(2).length / 2));
      let x1 = (x0 + value / x0) >> 1n;
      while (x1 < x0) {
        x0 = x1;
        x1 = (x0 + value / x0) >> 1n;
      }
      return x0;
    }

    function createSquareRootContinuedFraction(radicand) {
      const a0 = bigintSqrt(radicand);
      if (a0 * a0 === radicand) throw new Error('perfect square');
      let m = 0n;
      let d = 1n;
      let a = a0;
      return {
        a0,
        nextTerm() {
          m = d * a - m;
          d = (radicand - m * m) / d;
          a = (a0 + m) / d;
          return a;
        },
      };
    }

    function ensureTerms(count) {
      while (state.partialTerms.length < count) {
        state.partialTerms.push(state.continuedFraction.nextTerm());
      }
    }

    function buildNestedModules(depth) {
      ensureTerms(depth);
      const selected = state.partialTerms.slice(0, depth);
      const modules = [];
      let childValue = null;

      for (let index = selected.length - 1; index >= 0; index -= 1) {
        const integerTerm = selected[index];
        const denominatorExpression = childValue
          ? addFractions(fraction(integerTerm), childValue)
          : fraction(integerTerm);
        const value = reciprocalFraction(denominatorExpression);
        const p = value.numerator;
        const q = value.denominator;
        const unitPower = chooseTupletUnitPower(p, q);
        modules.push({
          sourceTermIndex: index,
          integerTerm,
          childValue,
          denominatorExpression,
          value,
          p,
          q,
          pSquared: p * p,
          qSquared: q * q,
          unitPower,
        });
        childValue = value;
      }
      return modules;
    }

    function floorLog2(value) {
      if (value <= 0n) throw new Error('log2 requires positive value');
      return value.toString(2).length - 1;
    }

    function chooseTupletUnitPower(p, q) {
      const product = p * q;
      let k = floorLog2(product);
      const thresholdSquared = 1n << BigInt(2 * k + 1);
      if (product * product >= thresholdSquared) k += 1;
      return Math.max(0, Math.min(config.maxMetronomePower, k));
    }

    function tupletDigits(value) {
      const span = createElement('span', 'smufl tuplet-digits');
      for (const digit of value.toString()) {
        span.append(document.createTextNode(char(SMUFL.tuplet0 + Number(digit))));
      }
      return span;
    }

    function makeNoteToken(power, dots = 0, extraClass = '') {
      const token = createElement('span', `note-token ${extraClass}`.trim());
      token.dataset.power = String(power);
      token.dataset.dots = String(dots);

      const note = createElement('span', 'smufl note-char');
      note.textContent = char(NOTE_CODEPOINT_BY_POWER.get(power));
      token.appendChild(note);

      for (let i = 0; i < dots; i += 1) {
        const dot = createElement('span', 'smufl dot-char');
        dot.textContent = char(SMUFL.metAugmentationDot);
        token.appendChild(dot);
      }
      return token;
    }

    function candidateTicks(basePower, dots, tickPower) {
      if (basePower < -1 || basePower > tickPower) return null;
      const baseShift = tickPower - basePower;
      const baseTicks = 1n << BigInt(baseShift);
      if (dots === 0) return baseTicks;
      if (baseShift < dots) return null;
      const numerator = (1n << BigInt(dots + 1)) - 1n;
      return (baseTicks * numerator) >> BigInt(dots);
    }

    function decomposeDyadicTicks(totalTicks, tickPower) {
      if (totalTicks <= 0n) return [];
      const pieces = [];
      let remaining = totalTicks;

      const breveTicks = 1n << BigInt(tickPower + 1);
      if (remaining >= breveTicks * config.compactBreveThreshold) {
        const breveCount = remaining / breveTicks;
        if (breveCount >= config.compactBreveThreshold) {
          pieces.push({ power: -1, dots: 0, count: breveCount });
          remaining -= breveCount * breveTicks;
        }
      }

      const candidates = [];
      for (let power = -1; power <= tickPower; power += 1) {
        for (let dots = 0; dots <= config.maxDots; dots += 1) {
          const ticks = candidateTicks(power, dots, tickPower);
          if (ticks !== null && ticks > 0n) candidates.push({ power, dots, ticks });
        }
      }
      candidates.sort((a, b) => {
        if (a.ticks === b.ticks) return a.dots - b.dots;
        return a.ticks > b.ticks ? -1 : 1;
      });

      while (remaining > 0n) {
        const candidate = candidates.find(item => item.ticks <= remaining);
        if (!candidate) throw new Error('could not decompose duration');
        pieces.push({ power: candidate.power, dots: candidate.dots, count: 1n });
        remaining -= candidate.ticks;
      }
      return pieces;
    }

    function createDurationSequenceFromTicks(totalTicks, tickPower, className = '') {
      const sequence = createElement('span', `duration-sequence ${className}`.trim());
      const pieces = decomposeDyadicTicks(totalTicks, tickPower);
      const anchors = [];

      for (const piece of pieces) {
        const token = makeNoteToken(piece.power, piece.dots, 'tie-anchor');
        if (piece.count > 1n) {
          token.classList.add('compact-count');
          const prefix = tupletDigits(piece.count);
          prefix.classList.add('count-prefix');
          token.insertBefore(prefix, token.firstChild);
          const times = createElement('span', 'times-sign', '×');
          token.insertBefore(times, token.querySelector('.note-char'));
        }
        sequence.appendChild(token);
        anchors.push(token);
      }
      sequence._tieAnchors = anchors;
      return sequence;
    }

    function createIntegerSpan(integerTerm) {
      return createDurationSequenceFromTicks(integerTerm, 0, 'input-duration');
    }

    function createTupletLabel(module) {
      const label = createElement('div', 'tuplet-label');
      label.appendChild(tupletDigits(module.qSquared));

      const unit = createElement('span', 'smufl unit-note');
      unit.textContent = char(NOTE_CODEPOINT_BY_POWER.get(module.unitPower));
      unit.title = `written tuplet unit = 1/${2 ** module.unitPower} whole note`;
      label.appendChild(unit);

      const colon = createElement('span', 'smufl tuplet-colon');
      colon.textContent = char(SMUFL.tupletColon);
      label.appendChild(colon);

      const inputSpan = createElement('span', 'input-span');
      const integerDuration = createIntegerSpan(module.integerTerm);
      inputSpan.appendChild(integerDuration);
      label.appendChild(inputSpan);

      module._inputSequence = integerDuration;
      return label;
    }

    function createResultSequence(module) {
      const sequence = createDurationSequenceFromTicks(module.pSquared, module.unitPower, 'result-sequence');
      sequence.title = `${module.pSquared.toString()} written unit(s) => actual duration ${formatFraction(module.value)}`;
      module._resultSequence = sequence;
      return sequence;
    }

    function createModuleElement(module) {
      const box = createElement('div', 'module');
      box.title = [
        `value = ${formatFraction(module.value)}`,
        `input = ${formatFraction(module.denominatorExpression)}`,
        `q² = ${module.qSquared.toString()}`,
        `p² = ${module.pSquared.toString()}`,
      ].join('\n');

      const bracket = createElement('div', 'tuplet-bracket');
      bracket.appendChild(createElement('span', 'bracket-hook-left'));
      bracket.appendChild(createTupletLabel(module));
      bracket.appendChild(createElement('span', 'bracket-hook-right'));
      box.appendChild(bracket);

      const resultRow = createElement('div', 'result-row');
      resultRow.appendChild(createResultSequence(module));
      resultRow.appendChild(createElement('div', 'result-caption', formatFraction(module.value)));
      box.appendChild(resultRow);

      module._element = box;
      return box;
    }

    function createRootRow() {
      const row = createElement('div', 'root-row');
      const duration = createIntegerSpan(state.a0);
      duration.classList.add('root-duration');
      row.appendChild(duration);
      state.rootRow = row;
      state._rootSequence = duration;
      return row;
    }

    function ensureTieLayer(width, height) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('tie-layer');
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      score.appendChild(svg);
      state.tieLayer = svg;
    }

    function rectRelativeToScore(element) {
      const rect = element.getBoundingClientRect();
      const scoreRect = score.getBoundingClientRect();
      return {
        left: rect.left - scoreRect.left,
        right: rect.right - scoreRect.left,
        top: rect.top - scoreRect.top,
        bottom: rect.bottom - scoreRect.top,
      };
    }

    function drawTie(fromElement, toElement, options = {}) {
      if (!fromElement || !toElement || !state.tieLayer) return;
      const from = rectRelativeToScore(fromElement);
      const to = rectRelativeToScore(toElement);
      let x1 = options.fromSide === 'left' ? from.left + 4 : from.right - 4;
      let x2 = options.toSide === 'right' ? to.right - 4 : to.left + 4;
      const y1 = from.bottom - 8;
      const y2 = to.bottom - 8;

      if (x2 < x1 && options.allowReverse !== false) [x1, x2] = [x2, x1];
      if (Math.abs(x2 - x1) < 10) return;

      const midX = (x1 + x2) / 2;
      const baseY = Math.max(y1, y2) + (options.lift || 8);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'tie-path');
      path.setAttribute('d', `M ${x1} ${y1} C ${midX - 12} ${baseY}, ${midX + 12} ${baseY}, ${x2} ${y2}`);
      state.tieLayer.appendChild(path);
    }

    function sequenceAnchors(sequence) {
      return sequence && sequence._tieAnchors ? sequence._tieAnchors : [];
    }

    function drawInternalTies(sequence) {
      const anchors = sequenceAnchors(sequence);
      for (let i = 0; i < anchors.length - 1; i += 1) drawTie(anchors[i], anchors[i + 1], { lift: 7 });
    }

    function layoutScore() {
      const modules = state.modules;
      const widths = modules.map(module => Math.max(205, module._element.getBoundingClientRect().width));
      const positions = new Array(modules.length);
      let x = config.leftPaddingPx + config.rootReservePx;

      for (let i = modules.length - 1; i >= 0; i -= 1) {
        positions[i] = { left: x, top: config.scoreTopPx + i * config.stepYPx };
        x += Math.max(config.minStepXPx, widths[i] + config.gapXPx);
      }

      for (let i = 0; i < modules.length; i += 1) {
        modules[i]._element.style.left = `${positions[i].left}px`;
        modules[i]._element.style.top = `${positions[i].top}px`;
      }

      const outer = modules[modules.length - 1];
      const outerPosition = positions[modules.length - 1];
      state.rootRow.style.left = `${config.leftPaddingPx}px`;
      state.rootRow.style.top = `${outerPosition.top + 49}px`;

      const rootWidth = state.rootRow.getBoundingClientRect().width;
      if (rootWidth + config.leftPaddingPx + 35 > outerPosition.left + 18) {
        const shift = rootWidth + config.leftPaddingPx + 55 - (outerPosition.left + 18);
        positions.forEach(position => { position.left += shift; });
        for (let i = 0; i < modules.length; i += 1) modules[i]._element.style.left = `${positions[i].left}px`;
      }

      const rightmost = Math.max(...modules.map((module, i) => positions[i].left + widths[i]));
      const bottom = Math.max(window.innerHeight, outerPosition.top + 150 + config.bottomPaddingPx);
      const width = Math.max(window.innerWidth, rightmost + config.rightPaddingPx);
      score.style.width = `${width}px`;
      score.style.height = `${bottom}px`;
      return { width, height: bottom };
    }

    function renderTies(layout) {
      ensureTieLayer(layout.width, layout.height);

      for (const module of state.modules) {
        drawInternalTies(module._resultSequence);
        drawInternalTies(module._inputSequence);
      }
      drawInternalTies(state._rootSequence);

      for (let i = 1; i < state.modules.length; i += 1) {
        const outer = state.modules[i];
        const child = state.modules[i - 1];
        const inputAnchors = sequenceAnchors(outer._inputSequence);
        const resultAnchors = sequenceAnchors(child._resultSequence);
        if (inputAnchors.length && resultAnchors.length) {
          drawTie(inputAnchors[inputAnchors.length - 1], resultAnchors[0], { lift: 10 });
        }
      }

      const rootAnchors = sequenceAnchors(state._rootSequence);
      const outerResultAnchors = sequenceAnchors(state.modules[state.modules.length - 1]._resultSequence);
      if (rootAnchors.length && outerResultAnchors.length) {
        drawTie(rootAnchors[rootAnchors.length - 1], outerResultAnchors[0], { lift: 10 });
      }
    }

    function renderStats() {
      const outer = state.modules[state.modules.length - 1];
      const approximation = addFractions(fraction(state.a0), outer.value);
      const approximationDecimal = fractionToDecimal(approximation);
      const errorDecimal = approximationDecimal.sub(state.trueRadicalDecimal).abs();
      const terms = state.partialTerms.slice(0, state.depth).map(value => value.toString());

      cfValue.textContent = `[${state.a0.toString()}; ${terms.join(', ')}]`;
      approxValue.textContent = `${formatFraction(approximation)} = ${formatDecimal(approximationDecimal)}`;
      truthLabel.textContent = `sqrt(${state.radicand.toString()}):`;
      truthValue.textContent = formatDecimal(state.trueRadicalDecimal);
      errorValue.textContent = formatDecimal(errorDecimal);
    }

    function renderScore() {
      state.modules = buildNestedModules(state.depth);
      state.moduleElements = [];
      state.rootRow = null;
      state.tieLayer = null;
      score.replaceChildren();

      for (const module of state.modules) {
        const element = createModuleElement(module);
        state.moduleElements.push(element);
        score.appendChild(element);
      }
      score.appendChild(createRootRow());

      const layout = layoutScore();
      requestAnimationFrame(() => renderTies(layout));
      renderStats();
    }

    function resetForRadicand(value) {
      const continuedFraction = createSquareRootContinuedFraction(value);
      state.radicand = value;
      state.depth = 1;
      state.a0 = continuedFraction.a0;
      state.partialTerms = [];
      state.continuedFraction = continuedFraction;
      state.trueRadicalDecimal = new Decimal(value.toString()).sqrt();
      errorMessage.textContent = '';
      renderScore();
    }

    function parseRadicand() {
      const raw = radicandInput.value.trim();
      if (!/^\d+$/.test(raw)) throw new Error('2以上の整数を入力してください。');
      const value = BigInt(raw);
      if (value < 2n) throw new Error('2以上の整数を入力してください。');
      return value;
    }

    function applyRadicand() {
      try {
        resetForRadicand(parseRadicand());
      } catch (error) {
        errorMessage.textContent = error.message === 'perfect square'
          ? '完全平方数は連分数ネストの対象外です。平方数ではない整数を入力してください。'
          : error.message;
      }
    }

    applyRadicandButton.addEventListener('click', applyRadicand);
    radicandInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') applyRadicand();
    });
    addDepthButton.addEventListener('click', () => {
      state.depth += 1;
      renderScore();
      requestAnimationFrame(() => window.scrollTo({ top: Math.max(0, score.scrollHeight - window.innerHeight), behavior: 'smooth' }));
    });
    removeDepthButton.addEventListener('click', () => {
      if (state.depth <= 1) return;
      state.depth -= 1;
      renderScore();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderScore, 80);
    }, { passive: true });

    resetForRadicand(2n);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderScore());
  </script>
</body>
</html>
